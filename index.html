function dwin(){S.rd.dec=(S.rd.dec||0)+1;rec('dec',true);S.stars++;S.coins+=3;save();hud();fx(['⭐','🎉','💖'],20);beep(784);sp([[pick(['เก่งมาก','สุดยอด']),'th-TH']]);if(dl<5)setTimeout(()=>{dl++;dst()},1600);else setTimeout(dend,1600)}
function dend(){S.coins+=10;save();fx(['🎉','💰','🎀','🦄','⭐'],40);V(`<div class="q"><div class="big">🏆</div><div class="prompt">ผ่านครบ 5 ด่าน! Master Decoder 🎊<br>โบนัส +10 💰</div><div class="opts"><button class="opt" onclick="dec(1)">🔄 เล่นอีก</button><button class="opt" onclick="shop()">🛍️ ไปช้อป</button></div></div>`)}
NAME.dec='🔐 ถอดรหัสสี';
const rec=(k,ok)=>{S.t[k]=(S.t[k]||0)+1;if(ok)S.r[k]=(S.r[k]||0)+1;save()};
function dash(){const T=Object.values(S.t).reduce((a,b)=>a+b,0),R=Object.values(S.r).reduce((a,b)=>a+b,0),ac=T?Math.round(R/T*100):0,B=[['🌱','เริ่มต้น',1],['🌟','10 ดาว',10],['🏅','20 ดาว',20],['🏆','50 ดาว',50],['👑','100 ดาว',100]];
V(`<h2>📊 แดชบอร์ดของหนู</h2><div class="st4">${[['⭐',S.stars,'ดาวสะสม','#ffb020,#ff7a1f'],['💰',S.coins,'เหรียญ','#2fbfb3,#1d8fd6'],['🔥',S.streak||1,'วันที่เล่นต่อเนื่อง','#ff6fa5,#e0287f'],['🎯',ac+'%','ตอบถูก','#9b6bff,#5b2bd1']].map(a=>`<div class="sc" style="background:linear-gradient(145deg,${a[3]})"><span style="font-size:30px">${a[0]}</span><b>${a[1]}</b>${a[2]}</div>`).join('')}</div><div class="panel"><h3>📈 ความก้าวหน้าแต่ละวิชา</h3>${Object.keys(NAME).map(k=>{const t=S.t[k]||0;return `<div class="sb"><span>${NAME[k]}</span><div class="bar"><i style="width:${Math.min(100,(S.rd[k]||0)*20)}%"></i></div><span style="width:44px;text-align:right">${t?Math.round((S.r[k]||0)/t*100)+'%':'-'}</span></div>`}).join('')}<small>แถบ = จำนวนรอบที่เล่น (5 รอบ = เต็ม) · ตัวเลข = ตอบถูกกี่ %</small></div><div class="panel"><h3>🏅 เหรียญรางวัล</h3><div class="bgs">${B.map(b=>`<div class="${S.stars>=b[2]?'':'lk'}">${b[0]}<small>${b[1]}</small></div>`).join('')}</div></div><button class="wide" onclick="cert()">🎓 ดูเกียรติบัตร</button>`)}
function cert(){$('mc').innerHTML=`<button class="x" onclick="cm()">✕</button><div class="cert"><div style="font-size:50px">🏆</div><b style="font-size:24px">เกียรติบัตร</b><div>มอบให้</div><input value="${S.name||''}" maxlength="16" style="font:inherit;font-size:26px;font-weight:800;text-align:center;width:100%;border:0;border-bottom:3px dashed #d9a400;background:transparent;color:#b86e00" oninput="S.name=this.value;save()"><div style="margin:8px 0">เป็นเด็กเก่ง ขยันเรียน<br>สะสมได้ <b>${S.stars}</b> ดาว · Level <b>${Math.floor(S.stars/20)+1}</b></div><div style="font-size:30px">${'⭐'.repeat(Math.min(5,Math.ceil(S.stars/20)))||'🌱'}</div></div><div class="nv"><button onclick="cm()">ปิด</button></div><small>📸 แคปหน้าจอเก็บไว้ได้เลย</small>`;$('md').style.display='grid'}
home();
</script></body></html>
