function shop(){V(`<h2 class="h2i">${I('shop',34)} ร้านแต่งตัว</h2><div class="hero" style="padding:0"><div class="av"></div></div><div class="tabs">${Object.keys(CAT).map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';shop()">${CAT[k]}</button>`).join('')}</div><div class="shop">${ITEMS[tab].map(([e,p])=>{const h=S.own.includes(e);return `<button class="it ${S.worn[tab]===e?'eq':''}" onclick="buy('${tab}','${e}',${p})">${itm(e,46)}<small>${h?(S.worn[tab]===e?'ใส่อยู่':'ใส่เลย'):I('coin',14)+' '+p}</small></button>`}).join('')}</div>`)}
function pay(e,p){if(S.own.includes(e))return 1;if(S.coins<p){beep(200,.25);sp([['เหรียญยังไม่พอ ไปเล่นเกมเพิ่มนะ','th-TH']]);fx(['💰','😢'],8);return 0}S.coins-=p;S.own.push(e);beep(880);ovl('ปลดล็อกของใหม่!',itm(e,110),'');return 1}
function buy(c,e,p){if(!pay(e,p))return;S.worn[c]=S.worn[c]===e?'':e;save();shop()}
const SP=[[30,105,40],[205,150,50],[45,60,34],[120,38,30],[150,100,64],[70,155,62],[215,55,40],[225,105,46],[130,185,40]];
function house(){const all=ITEMS.house;V(`<h2 class="h2i">${I('house',34)} บ้านของหนู</h2><svg class="rm" viewBox="0 0 300 250"><polygon points="20,90 150,20 150,150 20,200" fill="#ffd9e8" stroke="#c98fa5" stroke-width="3" stroke-linejoin="round"/><polygon points="150,20 280,90 280,200 150,150" fill="#ffe9f2" stroke="#c98fa5" stroke-width="3" stroke-linejoin="round"/><polygon points="20,200 150,150 280,200 150,245" fill="#e8b98a" stroke="#a87a50" stroke-width="3" stroke-linejoin="round"/><polygon points="95,205 150,182 205,205 150,228" fill="#ffb3d1"/><rect x="170" y="62" width="40" height="34" rx="4" fill="#bfe8ff" stroke="#fff" stroke-width="4"/><path d="M165 58h50v12l-6-4-6 6-6-6-6 6-6-6-6 4-6-4z" fill="#ffb3d1"/>${S.placed.map(e=>{const i=all.findIndex(x=>nk(x[0])===nk(e)),p=SP[i],m=ITM[nk(e)];return p&&m?`<g onclick="place('${e}')"><use href="#i-${m[0]}" x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[2]}"/></g>`:''}).join('')}${S.placed.length?'':'<text x="150" y="125" text-anchor="middle" fill="#a56a8a" font-weight="800" font-size="14">ซื้อของมาแต่งห้องนะ</text>'}</svg><div class="shop">${all.map(([e,p])=>{const h=S.own.includes(e);return `<button class="it ${S.placed.includes(e)?'eq':''}" onclick="hb('${e}',${p})">${itm(e,46)}<small>${h?(S.placed.includes(e)?'วางอยู่':'วางเลย'):I('coin',14)+' '+p}</small></button>`}).join('')}</div>`)}
function claim(){const td=new Date().toDateString();if(S.gift===td){sp([['วันนี้รับของขวัญแล้ว พรุ่งนี้มาใหม่นะ','th-TH']]);return}S.gift=td;S.coins+=5;save();hud();ovl('ได้รับของขวัญ!',GIFT,'+5 เหรียญ');setTimeout(home,2400)}
const hb=(e,p)=>{if(pay(e,p))place(e)};
function place(e){S.placed=S.placed.includes(e)?S.placed.filter(x=>x!==e):[...S.placed,e];save();house()}
let dl,dp,dpos,dh;
function dec(l){dl=l;dst()}
function dst(){const len=[2,2,3,3,4][dl-1];dp=shuf([1,2,3,4,5,6,7]).slice(0,len);dpos=0;dh=3;V(`<h2 class="h2i">${I('dec',34)} ถอดรหัสสี</h2><div class="gh"><span class="pill">ด่าน ${dl} / 5</span><span class="pill">${I('star',18)} ${S.stars}</span></div><div class="q" style="background:linear-gradient(#fff,#fff6cf)"><div class="prompt">ดูเลขรหัส แล้วแตะสีตามตารางเทียบสี</div><div class="pw">${dp.join(' - ')}</div><div class="legend">${DC.map((c,i)=>`<span><b>${i+1}</b><i style="background:${c[0]}"></i>${c[1]}</span>`).join('')}</div><div class="sls" id="ds">${dp.map(()=>'<div class="sl"></div>').join('')}</div><div class="dots">${shuf(DC.map((c,i)=>i)).map(i=>`<button class="dt" id="d${i}" style="background:${DC[i][0]}" onclick="dtap(${i})"></button>`).join('')}</div><div class="nv"><button onclick="dhint()">${I('bulb',18)} คำใบ้ (<b id="dh">3</b>)</button><button onclick="sp([[dp.join(' '),'th-TH']])">${I('vol',18)} ฟังรหัส</button><button onclick="dst()">${I('refresh',18)} ใหม่</button></div></div>`);setTimeout(()=>sp([[dp.join(' '),'th-TH']]),300)}
function dtap(i){if(dpos>=dp.length)return;if(i+1===dp[dpos]){$('ds').children[dpos].innerHTML=`<i style="display:block;width:34px;height:34px;border-radius:50%;background:${DC[i][0]}"></i>`;dpos++;beep(600);document.querySelectorAll('.dt').forEach(b=>b.classList.remove('hint'));if(dpos===dp.length)dwin()}else{beep(200,.25);dpos=0;[...$('ds').children].forEach(s=>s.innerHTML='');sp([['ลองใหม่อีกทีนะ','th-TH']])}}
function dhint(){if(dh<1||dpos>=dp.length)return;dh--;$('dh').textContent=dh;$('d'+(dp[dpos]-1)).classList.add('hint')}
function dwin(){S.rd.dec=(S.rd.dec||0)+1;rec('dec',true);S.stars++;S.coins+=3;save();hud();fx(['⭐','🎉','💖'],20);beep(784);sp([[pick(['เก่งมาก','สุดยอด']),'th-TH']]);if(dl<5)setTimeout(()=>{dl++;dst()},1600);else setTimeout(dend,1600)}
function dend(){S.coins+=10;save();fx(['🎉','💰','🎀','🦄','⭐'],40);V(`<div class="q"><div class="big">${I('trophy',100)}</div><div class="prompt">ผ่านครบ 5 ด่าน! Master Decoder<br>โบนัส +10 ${I('coin',20)}</div><div class="opts"><button class="opt" onclick="dec(1)">${I('refresh',22)} เล่นอีก</button><button class="opt" onclick="shop()">${I('shop',24)} ไปช้อป</button></div></div>`)}
NAME.dec='🔐 ถอดรหัสสี';for(const k in NAME)NAME[k]=NAME[k].replace(/^\S+\s/,'');
const rec=(k,ok)=>{S.t[k]=(S.t[k]||0)+1;if(ok)S.r[k]=(S.r[k]||0)+1;save()};
function dash(){const T=Object.values(S.t).reduce((a,b)=>a+b,0),R=Object.values(S.r).reduce((a,b)=>a+b,0),ac=T?Math.round(R/T*100):0,B=[['star','เริ่มต้น',1],['star','10 ดาว',10],['cert','20 ดาว',20],['trophy','50 ดาว',50],['crown','100 ดาว',100]];
V(`<h2 class="h2i">${I('dash',34)} แดชบอร์ดของหนู</h2><div class="st4">${[['star',S.stars,'ดาวสะสม','#ffb020,#ff7a1f'],['coin',S.coins,'เหรียญ','#2fbfb3,#1d8fd6'],['flame',S.streak||1,'วันที่เล่นต่อเนื่อง','#ff6fa5,#e0287f'],['target',ac+'%','ตอบถูก','#9b6bff,#5b2bd1']].map(a=>`<div class="sc" style="background:linear-gradient(145deg,${a[3]})">${I(a[0],40)}<b>${a[1]}</b>${a[2]}</div>`).join('')}</div><div class="panel"><h3>ความก้าวหน้าแต่ละวิชา</h3>${Object.keys(NAME).map(k=>{const t=S.t[k]||0;return `<div class="sb"><span>${I(k,20)} ${NAME[k]}</span><div class="bar"><i style="width:${Math.min(100,(S.rd[k]||0)*20)}%"></i></div><span style="width:44px;text-align:right">${t?Math.round((S.r[k]||0)/t*100)+'%':'-'}</span></div>`}).join('')}<small>แถบ = จำนวนรอบที่เล่น (5 รอบ = เต็ม) · ตัวเลข = ตอบถูกกี่ %</small></div><div class="panel"><h3>เหรียญรางวัล</h3><div class="bgs">${B.map(b=>`<div class="${S.stars>=b[2]?'':'lk'}">${I(b[0],38)}<small>${b[1]}</small></div>`).join('')}</div></div><button class="wide" onclick="cert()">${I('cert',22)} ดูเกียรติบัตร</button>`)}
function cert(){$('mc').innerHTML=`<button class="x" onclick="cm()">${I('x',18)}</button><div class="cert">${I('trophy',72)}<b style="font-size:24px">เกียรติบัตร</b><div>มอบให้</div><input value="${S.name||''}" maxlength="16" style="font:inherit;font-size:26px;font-weight:800;text-align:center;width:100%;border:0;border-bottom:3px dashed #d9a400;background:transparent;color:#b86e00" oninput="S.name=this.value;save()"><div style="margin:8px 0">เป็นเด็กเก่ง ขยันเรียน<br>สะสมได้ <b>${S.stars}</b> ดาว · Level <b>${Math.floor(S.stars/20)+1}</b></div><div style="font-size:30px">${I('star',34).repeat(Math.min(5,Math.ceil(S.stars/20)))||I('star',34)}</div></div><div class="nv"><button onclick="cm()">ปิด</button></div><small>📸 แคปหน้าจอเก็บไว้ได้เลย</small>`;$('md').style.display='grid'}
/* ===== Animation controller: events -> effects. Lottie hook (LOTTIE) falls back to built-in SVG/CSS ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let live=0;
const LOTTIE={};/* e.g. LOTTIE.levelup='assets/lottie/levelup.json' (free-licence file) */
const playLottie=(k,el)=>{if(RM||!LOTTIE[k])return;const go=()=>{try{lottie.loadAnimation({container:el,renderer:'svg',loop:false,autoplay:true,path:LOTTIE[k]})}catch(e){}};if(window.lottie)go();else{const j=document.createElement('script');j.src='https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js';j.onload=go;document.head.appendChild(j)}};
function burst(el,n=10){if(RM||live>40||!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const d=document.createElement('div'),a=i/n*6.283;d.className='fx';d.innerHTML=I(i%3?'star':'coin',26);d.style.left=cx+'px';d.style.top=cy+'px';d.style.setProperty('--x',Math.cos(a)*(70+Math.random()*60)+'px');d.style.setProperty('--y',Math.sin(a)*(70+Math.random()*60)+'px');document.body.appendChild(d);live++;setTimeout(()=>{d.remove();live--},1400)}}
function coinFly(){if(RM)return;const a=$('bg').getBoundingClientRect(),b=$('cn').getBoundingClientRect(),d=document.createElement('div');d.className='fl2';d.innerHTML=I('coin',30);d.style.cssText=`left:${a.left+a.width/2}px;top:${a.top}px;--dx:${b.left-a.left-a.width/2}px;--dy:${b.top-a.top}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function cheer(){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.innerHTML=`<div style="width:46px">${av()}</div><b>ไม่เป็นไรนะ ลองอีกครั้ง สู้ๆ!</b>`;document.body.appendChild(t);setTimeout(()=>t.remove(),1700)}
function ovl(t,h,sub,k){document.querySelectorAll('.ov').forEach(e=>e.remove());const o=document.createElement('div');o.className='ov';o.onclick=()=>o.remove();o.innerHTML=`<div class="ovc"><div id="lt">${h}</div><b>${t}</b><span>${sub||''}</span></div>`;document.body.appendChild(o);burst(o.firstChild,14);if(k)playLottie(k,o.querySelector('#lt'));setTimeout(()=>o.remove(),2300)}
const GIFT='<svg class="ic" width="110" height="110" viewBox="0 0 48 48"><rect x="7" y="22" width="34" height="22" rx="3" fill="url(#gPink)" stroke="rgba(0,0,0,.2)" stroke-width="2"/><rect x="21" y="22" width="6" height="22" fill="url(#gGold)"/><g class="lid"><rect x="4" y="14" width="40" height="9" rx="3" fill="url(#gRed)" stroke="rgba(0,0,0,.2)" stroke-width="2"/><rect x="21" y="14" width="6" height="9" fill="url(#gGold)"/><path d="M24 14c-8-9-13-2-8 0zM24 14c8-9 13-2 8 0z" fill="url(#gGold)"/></g></svg>';

document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=I(e.dataset.i,20));
home();setTimeout(()=>{const l=$('ld');if(l){l.classList.add('out');setTimeout(()=>l.remove(),500)}},400);
</script></body></html>
